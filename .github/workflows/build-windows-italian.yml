
name: Build Fly on the Wall 2.4.0 (Italian + Local AI)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: swarnavspujari/fly-on-the-wall
          ref: v2.4.0
          persist-credentials: false

      - name: Apply Italian default transcription language
        shell: pwsh
        run: |
          $p = 'src-tauri/src/pipeline.rs'
          $s = Get-Content $p -Raw

          $old = 'None => Some("en".to_string()),'
          $new = 'None => Some("it".to_string()),'

          if (-not $s.Contains($old)) {
            throw "Patch context not found in $p. The upstream source may have changed."
          }

          $s = $s.Replace($old, $new)

          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

          if (-not (Select-String -Path $p -SimpleMatch $new -Quiet)) {
            throw 'Italian language patch verification failed.'
          }

      - name: Allow private LAN HTTP endpoints for local AI
        shell: pwsh
        run: |
          $p = 'src-tauri/src/llm_commands.rs'
          $s = Get-Content $p -Raw

          if (-not $s.Contains('pub fn validate_base_url')) {
            throw "validate_base_url function not found."
          }

          $loopbackPattern = '(?s)let loopback\s*=\s*parsed\.host_str\(\)\.is_some_and\(\|h\| \{.*?\n\s*\}\);'

          $loopbackMatches = [regex]::Matches($s, $loopbackPattern)

          if ($loopbackMatches.Count -ne 1) {
            throw "Expected one loopback validation block, found $($loopbackMatches.Count)."
          }

          $privateHost = @'
          let private_host = parsed.host_str().is_some_and(|h| {
              let host = h.trim_start_matches('[').trim_end_matches(']');

              host.eq_ignore_ascii_case("localhost")
                  || host.parse::<std::net::IpAddr>().is_ok_and(|ip| match ip {
                      std::net::IpAddr::V4(v4) => {
                          v4.is_private() || v4.is_loopback()
                      }
                      std::net::IpAddr::V6(v6) => {
                          v6.is_loopback()
                              || (v6.segments()[0] & 0xfe00) == 0xfc00
                      }
                  })
          });
          '@

          $s = [regex]::Replace(
            $s,
            $loopbackPattern,
            $privateHost.Trim(),
            1
          )

          $conditionPattern = '!keyed\s*\|\|\s*loopback'
          $conditionMatches = [regex]::Matches($s, $conditionPattern)

          if ($conditionMatches.Count -ne 1) {
            throw "Expected one keyed-provider loopback condition, found $($conditionMatches.Count)."
          }

          $s = [regex]::Replace(
            $s,
            $conditionPattern,
            '!keyed || private_host',
            1
          )

          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

          if (-not $s.Contains('let private_host = parsed.host_str()')) {
            throw "Private host validation was not installed."
          }

          if (-not $s.Contains('!keyed || private_host')) {
            throw "Private host condition was not installed."
          }

          Write-Host "Private LAN HTTP patch applied successfully."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install WebView2 and Windows build dependencies
        shell: pwsh
        run: |
          rustc -V
          node -v
          npm.cmd -v

      - name: Install frontend dependencies
        run: npm.cmd --prefix frontend ci --no-audit --no-fund

      - name: Build frontend
        run: npm.cmd --prefix frontend run build

      - name: Build MCP sidecar
        run: cargo build --release -p fly-mcp

      - name: Prepare sidecar
        run: node scripts/prepare-sidecars.mjs

      - name: Install Tauri CLI
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Build Windows NSIS installer
        run: npm.cmd exec tauri build -- --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FlyOnTheWall-2.4.0-Italian-Local-AI-Windows-Installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
